<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- background so it reads well on GitHub light and dark themes -->
  <rect x="0" y="0" width="820" height="300" rx="12" fill="#ffffff"/>

  <!-- Boxes -->
  <g font-size="15" text-anchor="middle">
    <rect x="20" y="40" width="150" height="70" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="95" y="70" font-weight="600" fill="#24292f">Category</text>
    <text x="95" y="92" font-size="12" fill="#57606a">Work, Ads, …</text>

    <rect x="230" y="40" width="150" height="70" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="305" y="70" font-weight="600" fill="#0a3069">Condition</text>
    <text x="305" y="92" font-size="12" fill="#57606a">youtube.com</text>

    <rect x="440" y="40" width="150" height="70" rx="10" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
    <text x="515" y="70" font-weight="600" fill="#4d2d00">Proxy rule</text>
    <text x="515" y="92" font-size="12" fill="#57606a">match any → proxy</text>

    <rect x="650" y="40" width="150" height="70" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="725" y="70" font-weight="600" fill="#044f1e">Proxy</text>
    <text x="725" y="92" font-size="12" fill="#57606a">PROXY 10.0.0.5:3128</text>

    <rect x="420" y="200" width="190" height="76" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
    <text x="515" y="228" font-weight="600" fill="#3e1f79">PAC file</text>
    <text x="515" y="248" font-size="12" fill="#57606a">rules in priority order</text>
    <text x="515" y="264" font-size="12" fill="#57606a">+ fallback proxy</text>
  </g>

  <!-- Arrows -->
  <g stroke="#57606a" stroke-width="1.5" fill="none">
    <line x1="170" y1="75" x2="228" y2="75" marker-end="url(#arrow)"/>
    <line x1="380" y1="75" x2="438" y2="75" marker-end="url(#arrow)"/>
    <line x1="590" y1="75" x2="648" y2="75" marker-end="url(#arrow)"/>
    <line x1="515" y1="110" x2="515" y2="198" marker-end="url(#arrow)"/>
    <path d="M610,238 H725 V112" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  </g>

  <!-- Arrow labels -->
  <g font-size="12" fill="#57606a" text-anchor="middle">
    <text x="200" y="66">labels</text>
    <text x="410" y="56">grouped</text>
    <text x="410" y="68">into</text>
    <text x="620" y="66">uses</text>
    <text x="505" y="152" text-anchor="end">included in</text>
    <text x="505" y="166" text-anchor="end">(by priority)</text>
    <text x="735" y="180" text-anchor="start">fallback</text>
  </g>
</svg>
